<div *ngIf="show"
     class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">

    <div class="px-6 py-4 border-b border-gray-100 flex items-center gap-3 bg-indigo-600">
      <div class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <div class="flex-1">
        <p class="font-semibold text-white text-sm">Joindre un document</p>
        <p class="text-xs text-white/70 mt-0.5">Convention ou attestation de stage</p>
      </div>
      <button (click)="fermer()" aria-label="Fermer" class="text-white/70 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="p-6 space-y-4">

      <div *ngIf="checkingConvention" class="flex items-center gap-2 text-sm text-gray-400">
        <div class="w-4 h-4 border-2 border-gray-300 border-t-indigo-500 rounded-full animate-spin"></div>
        Vérification des documents...
      </div>

      <div *ngIf="!checkingConvention && stageHasConvention"
           class="flex items-start gap-3 px-4 py-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm">
        <svg class="w-4 h-4 flex-shrink-0 mt-0.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        <span>Une convention de stage est déjà jointe. Seule une attestation peut être créée.</span>
      </div>

      <div *ngIf="errorDoc"
           class="flex items-center gap-3 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ errorDoc }}
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">
          Type de document <span class="text-red-500">*</span>
        </label>
        <select [(ngModel)]="docType"
                class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl
                       focus:border-indigo-500 focus:bg-white focus:ring-0 outline-none transition-all">
          <option value="CONVENTION" [disabled]="stageHasConvention">
            Convention de stage{{ stageHasConvention ? ' (déjà jointe)' : '' }}
          </option>
          <option value="ATTESTATION">Attestation de stage</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">
          Date d'émission <span class="text-red-500">*</span>
        </label>
        <input type="date" [(ngModel)]="docDateEmission"
               class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl
                      focus:border-indigo-500 focus:bg-white focus:ring-0 outline-none transition-all"/>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">
          Fichier PDF <span class="text-red-500">*</span>
        </label>
        <label class="flex items-center gap-3 px-4 py-3 bg-gray-50 border-2 border-dashed border-gray-200
                      rounded-xl cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/50 transition-all group">
          <svg class="w-5 h-5 text-gray-400 group-hover:text-indigo-500 transition-colors flex-shrink-0"
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
          <span class="text-sm" [ngClass]="docFile ? 'text-indigo-700 font-medium' : 'text-gray-400'">
            {{ docFile ? docFile.name : 'Cliquer pour sélectionner un PDF' }}
          </span>
          <input type="file" accept="application/pdf" class="hidden" (change)="onFileChange($event)"/>
        </label>
      </div>

    </div>

    <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-end gap-3">
      <button (click)="fermer()" [disabled]="soumissionDoc"
              class="px-5 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 hover:border-gray-300 rounded-xl transition-colors disabled:opacity-50">
        Annuler
      </button>
      <button (click)="creerDocument()" [disabled]="soumissionDoc || (stageHasConvention && docType === 'CONVENTION')"
              class="flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition-all shadow-md shadow-indigo-500/25 disabled:opacity-50 disabled:cursor-not-allowed">
        <div *ngIf="soumissionDoc" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        {{ soumissionDoc ? 'Création...' : 'Joindre le document' }}
      </button>
    </div>
  </div>
</div>
