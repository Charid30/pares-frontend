<div *ngIf="show && demande" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm" (click)="fermer()"></div>
  <div class="relative bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden">
    <div class="bg-gradient-to-br from-amber-500 to-orange-600 px-6 py-5">
      <h3 class="text-lg font-bold text-white">Demande de {{ getTypeLabel(demande.type) }}</h3>
      <p class="text-amber-100 text-sm">{{ demande.candidat?.prenom }} {{ demande.candidat?.nom }}</p>
    </div>
    <div class="px-6 py-5 space-y-4">

      <div *ngIf="errorMessage"
           class="flex items-center gap-3 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ errorMessage }}
      </div>

      <div class="bg-gray-50 rounded-xl p-4">
        <p class="text-xs font-semibold text-gray-500 uppercase mb-1">Motif</p>
        <p class="text-sm text-gray-800">{{ demande.motif }}</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Décision</label>
        <div class="flex gap-3">
          <button (click)="form.status = 'APPROUVEE'"
            class="flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition-all"
            [ngClass]="form.status === 'APPROUVEE' ? 'border-green-500 bg-green-50 text-green-700' : 'border-gray-200 text-gray-600 hover:border-green-300'">
            ✓ Approuver
          </button>
          <button (click)="form.status = 'REJETEE'"
            class="flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition-all"
            [ngClass]="form.status === 'REJETEE' ? 'border-red-500 bg-red-50 text-red-700' : 'border-gray-200 text-gray-600 hover:border-red-300'">
            ✗ Rejeter
          </button>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Commentaire (optionnel)</label>
        <textarea [(ngModel)]="form.reponse_drh" rows="3"
          class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
          placeholder="Commentaire pour le candidat..."></textarea>
      </div>
    </div>
    <div class="px-6 pb-6 flex gap-3">
      <button (click)="confirmer()" [disabled]="!form.status || submitting"
        class="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-xl transition-all disabled:opacity-50">
        {{ submitting ? 'Enregistrement...' : 'Confirmer la décision' }}
      </button>
      <button (click)="fermer()"
        class="py-3 px-5 bg-gray-100 text-gray-600 font-medium rounded-xl hover:bg-gray-200">
        Annuler
      </button>
    </div>
  </div>
</div>
